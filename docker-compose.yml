# Explorer and MongoDB. The explorer starts its background jobs itself; config.json decides which
# (npm run worker -- --plan lists them).
#
#   cp config.example.json config.json   # then point web3Provider.url at your node
#   docker compose up -d --build
#
# A node running on the Docker host is reachable as http://host.docker.internal:<port>.
# MongoDB is only reachable inside this project's network (no published port).

x-explorer: &explorer
  image: vbc-explorer
  build: .
  restart: unless-stopped
  environment:
    MONGODB_URI: mongodb://db:27017/explorerDB
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    - db

services:
  explorer:
    <<: *explorer
    command: npm start
    ports:
      - '3000:3000'
  db:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
